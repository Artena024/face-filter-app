<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Face Filter - Yoshi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: rgba(0, 0, 0, 0.8);
            border-radius: 20px;
            padding: 30px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            color: #fff;
            margin-bottom: 20px;
            text-align: center;
            font-size: 2.5em;
        }
        
        .video-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 0 auto 20px;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            aspect-ratio: 4 / 3;
        }
        
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .controls {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        
        button {
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        .filter-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .filter-btn {
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
        }
        
        .filter-btn:hover {
            background: rgba(102, 126, 234, 0.5);
            border-color: rgba(102, 126, 234, 1);
        }
        
        .filter-btn.active {
            background: rgba(102, 126, 234, 1);
            border-color: rgba(102, 126, 234, 1);
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.6);
        }
        
        .status {
            color: #0f0;
            text-align: center;
            font-size: 12px;
            padding: 10px;
            background: rgba(0, 255, 0, 0.1);
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐢 AR Face Filter</h1>
        
        <div class="video-container">
            <video id="video" autoplay playsinline muted></video>
            <canvas id="canvas"></canvas>
        </div>
        
        <div class="controls">
            <button onclick="startCamera()">📷 Start</button>
            <button onclick="stopCamera()">⏹️ Stop</button>
            <button onclick="captureImage()">📸 Snap</button>
        </div>
        
        <h3 style="color: #fff; margin-bottom: 10px;">Filters</h3>
        <div class="filter-grid">
            <button class="filter-btn active" onclick="setFilter('rainbow')">🌈 Rainbow</button>
            <button class="filter-btn" onclick="setFilter('pixelate')">🟫 Pixelate</button>
            <button class="filter-btn" onclick="setFilter('mirror')">🪞 Mirror</button>
            <button class="filter-btn" onclick="setFilter('noir')">🖤 Noir</button>
            <button class="filter-btn" onclick="setFilter('invert')">⚫ Invert</button>
            <button class="filter-btn" onclick="setFilter('none')">None</button>
        </div>
        
        <div class="status" id="status">Ready ✅</div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let isRunning = false;
        let currentFilter = 'rainbow';
        let time = 0;
        
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        width: { ideal: 640 },
                        height: { ideal: 480 },
                        facingMode: 'user'
                    }
                });
                
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    document.getElementById('status').textContent = `✅ Camera Started (${canvas.width}x${canvas.height})`;
                    isRunning = true;
                    applyEffects();
                };
            } catch (e) {
                document.getElementById('status').textContent = '❌ ' + e.message;
            }
        }
        
        function applyEffects() {
            if (!isRunning) return;
            
            // Draw video
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Get image data
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            
            switch(currentFilter) {
                case 'rainbow':
                    applyRainbow(data);
                    break;
                case 'pixelate':
                    applyPixelate();
                    break;
                case 'mirror':
                    applyMirror();
                    break;
                case 'noir':
                    applyNoir(data);
                    break;
                case 'invert':
                    applyInvert(data);
                    break;
            }
            
            if (currentFilter !== 'mirror' && currentFilter !== 'none') {
                ctx.putImageData(imageData, 0, 0);
            }
            
            time++;
            requestAnimationFrame(applyEffects);
        }
        
        function applyRainbow(data) {
            for (let i = 0; i < data.length; i += 4) {
                const hue = (time * 2 + (i / data.length) * 360) % 360;
                const [r, g, b] = hslToRgb(hue, 100, 50);
                
                const origR = data[i];
                const origG = data[i + 1];
                const origB = data[i + 2];
                
                data[i] = origR * 0.6 + r * 0.4;
                data[i + 1] = origG * 0.6 + g * 0.4;
                data[i + 2] = origB * 0.6 + b * 0.4;
            }
        }
        
        function applyPixelate() {
            const pixelSize = 10;
            const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
            
            for (let y = 0; y < canvas.height; y += pixelSize) {
                for (let x = 0; x < canvas.width; x += pixelSize) {
                    const pixelData = ctx.getImageData(x, y, pixelSize, pixelSize);
                    const d = pixelData.data;
                    
                    let r = 0, g = 0, b = 0;
                    for (let i = 0; i < d.length; i += 4) {
                        r += d[i];
                        g += d[i + 1];
                        b += d[i + 2];
                    }
                    
                    const count = d.length / 4;
                    ctx.fillStyle = `rgb(${Math.floor(r/count)}, ${Math.floor(g/count)}, ${Math.floor(b/count)})`;
                    ctx.fillRect(x, y, pixelSize, pixelSize);
                }
            }
        }
        
        function applyMirror() {
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            ctx.save();
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            ctx.restore();
        }
        
        function applyNoir(data) {
            for (let i = 0; i < data.length; i += 4) {
                const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
                data[i] = avg;
                data[i + 1] = avg;
                data[i + 2] = avg;
            }
        }
        
        function applyInvert(data) {
            for (let i = 0; i < data.length; i += 4) {
                data[i] = 255 - data[i];
                data[i + 1] = 255 - data[i + 1];
                data[i + 2] = 255 - data[i + 2];
            }
        }
        
        function hslToRgb(h, s, l) {
            s /= 100;
            l /= 100;
            const a = s * Math.min(l, 1 - l);
            const f = n => {
                const k = (n + h / 30) % 12;
                return l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
            };
            return [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255)];
        }
        
        function stopCamera() {
            isRunning = false;
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(t => t.stop());
                document.getElementById('status').textContent = '⏹️ Camera Stopped';
            }
        }
        
        function setFilter(f) {
            currentFilter = f;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('status').textContent = `Filter: ${f} ✨`;
        }
        
        function captureImage() {
            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/png');
            link.download = 'face-filter-' + Date.now() + '.png';
            link.click();
        }
    </script>
</body>
</html>
