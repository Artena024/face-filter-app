<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Face Filter - Yoshi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: rgba(0, 0, 0, 0.8);
            border-radius: 20px;
            padding: 30px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            color: #fff;
            margin-bottom: 20px;
            text-align: center;
            font-size: 2.5em;
        }
        
        .video-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 0 auto 20px;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            aspect-ratio: 4 / 3;
        }
        
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .controls {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        
        button {
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        .filter-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .filter-btn {
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
        }
        
        .filter-btn:hover {
            background: rgba(102, 126, 234, 0.5);
            border-color: rgba(102, 126, 234, 1);
        }
        
        .filter-btn.active {
            background: rgba(102, 126, 234, 1);
            border-color: rgba(102, 126, 234, 1);
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.6);
        }
        
        .status {
            color: #0f0;
            text-align: center;
            font-size: 12px;
            padding: 10px;
            background: rgba(0, 255, 0, 0.1);
            border-radius: 8px;
            word-break: break-all;
        }
        
        .error {
            color: #f00;
            background: rgba(255, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐢 AR Face Filter</h1>
        
        <div class="video-container">
            <video id="video" autoplay playsinline muted></video>
            <canvas id="canvas"></canvas>
        </div>
        
        <div class="controls">
            <button onclick="startCamera()">📷 Start</button>
            <button onclick="stopCamera()">⏹️ Stop</button>
            <button onclick="captureImage()">📸 Snap</button>
        </div>
        
        <h3 style="color: #fff; margin-bottom: 10px;">Filters</h3>
        <div class="filter-grid">
            <button class="filter-btn active" onclick="setFilter('test')">🔴 Test</button>
            <button class="filter-btn" onclick="setFilter('emoji')">😊 Emoji</button>
            <button class="filter-btn" onclick="setFilter('heart')">❤️ Hearts</button>
            <button class="filter-btn" onclick="setFilter('blur')">🌫️ Blur</button>
            <button class="filter-btn" onclick="setFilter('glow')">✨ Glow</button>
            <button class="filter-btn" onclick="setFilter('none')">None</button>
        </div>
        
        <div class="status" id="status">Ready</div>
    </div>

    <script async src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script async src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script async src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js"></script>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let camera = null;
        let faceDetection = null;
        let currentFilter = 'test';
        let detections = [];
        let isRunning = false;
        
        function log(msg) {
            console.log('[YOSHI]', msg);
            document.getElementById('status').textContent = msg;
        }
        
        async function initializeFaceDetection() {
            log('Initializing face detection...');
            
            faceDetection = new FaceDetection({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`
            });
            
            faceDetection.setOptions({ model: 'short_range' });
            faceDetection.onResults(onFaceDetectionResults);
            
            log('Face detection ready!');
        }
        
        function onFaceDetectionResults(results) {
            detections = results.detections || [];
            if (detections.length > 0) {
                log(`Detected ${detections.length} face(s) | Filter: ${currentFilter}`);
            }
        }
        
        function drawFrame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw canvas size debug
            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.fillText(`Canvas: ${canvas.width}x${canvas.height}`, 10, 20);
            
            if (detections.length === 0) return;
            
            detections.forEach((detection, idx) => {
                const box = detection.boundingBox;
                const x = box.originX * canvas.width;
                const y = box.originY * canvas.height;
                const w = box.width * canvas.width;
                const h = box.height * canvas.height;
                
                applyFilter(x, y, w, h, idx);
            });
            
            if (isRunning) requestAnimationFrame(drawFrame);
        }
        
        function applyFilter(x, y, w, h, idx) {
            const cx = x + w / 2;
            const cy = y + h / 2;
            
            switch(currentFilter) {
                case 'test':
                    // Bright red box - always visible
                    ctx.strokeStyle = '#FF0000';
                    ctx.lineWidth = 4;
                    ctx.strokeRect(x, y, w, h);
                    ctx.fillStyle = 'rgba(255, 0, 0, 0.3)';
                    ctx.fillRect(x, y, w, h);
                    break;
                    
                case 'emoji':
                    ctx.font = Math.floor(w * 0.7) + 'px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('😊', cx, cy);
                    break;
                    
                case 'heart':
                    ctx.font = Math.floor(w * 0.4) + 'px Arial';
                    for (let i = 0; i < 6; i++) {
                        const angle = (i / 6) * Math.PI * 2;
                        const dist = w * 0.5;
                        const hx = cx + Math.cos(angle) * dist;
                        const hy = cy + Math.sin(angle) * dist;
                        ctx.fillText('❤️', hx, hy);
                    }
                    break;
                    
                case 'blur':
                    ctx.strokeStyle = 'rgba(100, 150, 255, 0.8)';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(x - 5, y - 5, w + 10, h + 10);
                    ctx.fillStyle = 'rgba(100, 150, 255, 0.2)';
                    ctx.fillRect(x, y, w, h);
                    break;
                    
                case 'glow':
                    ctx.strokeStyle = 'rgba(255, 100, 200, 0.8)';
                    ctx.lineWidth = 4;
                    ctx.strokeRect(x - 10, y - 10, w + 20, h + 20);
                    ctx.strokeStyle = 'rgba(255, 100, 200, 0.4)';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(x - 15, y - 15, w + 30, h + 30);
                    break;
            }
        }
        
        async function startCamera() {
            try {
                log('Requesting camera permission...');
                
                await initializeFaceDetection();
                
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        width: { ideal: 640 },
                        height: { ideal: 480 },
                        facingMode: 'user'
                    }
                });
                
                video.srcObject = stream;
                
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    log(`✅ Camera started (${canvas.width}x${canvas.height})`);
                };
                
                setTimeout(() => {
                    if (canvas.width === 0) {
                        canvas.width = 640;
                        canvas.height = 480;
                    }
                    
                    camera = new Camera(video, {
                        onFrame: async () => {
                            await faceDetection.send({ image: video });
                        },
                        width: canvas.width,
                        height: canvas.height
                    });
                    
                    camera.start();
                    isRunning = true;
                    drawFrame();
                }, 500);
                
            } catch (e) {
                log('❌ Error: ' + e.message, true);
            }
        }
        
        function stopCamera() {
            if (camera) {
                camera.stop();
                isRunning = false;
                video.srcObject.getTracks().forEach(t => t.stop());
                log('⏹️ Camera stopped');
            }
        }
        
        function setFilter(f) {
            currentFilter = f;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            log('Filter: ' + f);
        }
        
        function captureImage() {
            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/png');
            link.download = 'face-filter-' + Date.now() + '.png';
            link.click();
        }
    </script>
</body>
</html>
