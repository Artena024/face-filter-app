<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Face Filter - Yoshi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: rgba(0, 0, 0, 0.8);
            border-radius: 20px;
            padding: 30px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            color: #fff;
            margin-bottom: 20px;
            text-align: center;
            font-size: 2.5em;
        }
        
        .video-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 0 auto 20px;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            aspect-ratio: 4 / 3;
        }
        
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .controls {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        
        button {
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        .filter-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .filter-btn {
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
        }
        
        .filter-btn:hover {
            background: rgba(102, 126, 234, 0.5);
            border-color: rgba(102, 126, 234, 1);
        }
        
        .filter-btn.active {
            background: rgba(102, 126, 234, 1);
            border-color: rgba(102, 126, 234, 1);
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.6);
        }
        
        .status {
            color: #0f0;
            text-align: center;
            font-size: 12px;
            padding: 10px;
            background: rgba(0, 255, 0, 0.1);
            border-radius: 8px;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐢 AR Face Filter</h1>
        
        <div class="video-container">
            <video id="video" autoplay playsinline muted></video>
            <canvas id="canvas"></canvas>
        </div>
        
        <div class="controls">
            <button onclick="startCamera()">📷 Start</button>
            <button onclick="stopCamera()">⏹️ Stop</button>
            <button onclick="captureImage()">📸 Snap</button>
        </div>
        
        <h3 style="color: #fff; margin-bottom: 10px;">Filters (Auto Face Tracking)</h3>
        <div class="filter-grid">
            <button class="filter-btn active" onclick="setFilter('glow')">✨ Glow</button>
            <button class="filter-btn" onclick="setFilter('rainbow')">🌈 Rainbow</button>
            <button class="filter-btn" onclick="setFilter('pixelate')">🟫 Pixelate</button>
            <button class="filter-btn" onclick="setFilter('blur')">🌫️ Blur</button>
            <button class="filter-btn" onclick="setFilter('invert')">⚫ Invert</button>
            <button class="filter-btn" onclick="setFilter('none')">None</button>
        </div>
        
        <div class="status" id="status">Ready ✅</div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let isRunning = false;
        let currentFilter = 'glow';
        let time = 0;
        
        // Motion detection
        let prevFrameData = null;
        let faceCircle = {
            x: 0,
            y: 0,
            radius: 100,
            vx: 0,
            vy: 0
        };
        
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user' }
                });
                
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    faceCircle.x = canvas.width / 2;
                    faceCircle.y = canvas.height / 2;
                    faceCircle.radius = Math.min(canvas.width, canvas.height) * 0.2;
                    document.getElementById('status').textContent = `✅ Tracking face...`;
                    isRunning = true;
                    draw();
                };
            } catch (e) {
                document.getElementById('status').textContent = '❌ ' + e.message;
            }
        }
        
        function detectMotion() {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            
            if (!prevFrameData) {
                prevFrameData = new Uint8ClampedArray(data);
                return null;
            }
            
            // Find motion areas (sample every 4 pixels for performance)
            const motionMap = new Array(canvas.width * canvas.height / 16).fill(0);
            let maxMotion = 0;
            let motionX = 0, motionY = 0;
            
            const step = 4;
            for (let i = 0; i < data.length; i += step * 4) {
                const r = Math.abs(data[i] - prevFrameData[i]);
                const g = Math.abs(data[i + 1] - prevFrameData[i + 1]);
                const b = Math.abs(data[i + 2] - prevFrameData[i + 2]);
                
                const motion = r + g + b;
                const pixelIndex = i / (step * 4);
                const gridX = (pixelIndex % (canvas.width / step));
                const gridY = Math.floor(pixelIndex / (canvas.width / step));
                
                if (motion > 30) {
                    motionMap[pixelIndex] = motion;
                    if (motion > maxMotion) {
                        maxMotion = motion;
                        motionX = gridX * step;
                        motionY = gridY * step;
                    }
                }
            }
            
            prevFrameData = new Uint8ClampedArray(data);
            
            if (maxMotion > 50) {
                return { x: motionX, y: motionY };
            }
            
            return null;
        }
        
        function draw() {
            if (!isRunning) return;
            
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Detect motion and update circle
            const motion = detectMotion();
            if (motion) {
                faceCircle.vx = motion.x - faceCircle.x;
                faceCircle.vy = motion.y - faceCircle.y;
                
                faceCircle.x += faceCircle.vx * 0.3;
                faceCircle.y += faceCircle.vy * 0.3;
            }
            
            // Smooth movement
            faceCircle.x = Math.max(faceCircle.radius, Math.min(canvas.width - faceCircle.radius, faceCircle.x));
            faceCircle.y = Math.max(faceCircle.radius, Math.min(canvas.height - faceCircle.radius, faceCircle.y));
            
            // Draw circle
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(faceCircle.x, faceCircle.y, faceCircle.radius, 0, Math.PI * 2);
            ctx.stroke();
            
            // Apply filter inside circle only
            if (currentFilter !== 'none') {
                applyFilterToCircle();
            }
            
            document.getElementById('status').textContent = `✅ Tracking | Filter: ${currentFilter}`;
            
            time++;
            requestAnimationFrame(draw);
        }
        
        function applyFilterToCircle() {
            const x = Math.max(0, faceCircle.x - faceCircle.radius);
            const y = Math.max(0, faceCircle.y - faceCircle.radius);
            const w = Math.min(canvas.width - x, faceCircle.radius * 2);
            const h = Math.min(canvas.height - y, faceCircle.radius * 2);
            
            const imageData = ctx.getImageData(x, y, w, h);
            const data = imageData.data;
            
            // Create circular mask
            const centerX = faceCircle.x - x;
            const centerY = faceCircle.y - y;
            
            for (let py = 0; py < h; py++) {
                for (let px = 0; px < w; px++) {
                    const dist = Math.sqrt((px - centerX) ** 2 + (py - centerY) ** 2);
                    
                    if (dist > faceCircle.radius) continue;
                    
                    const idx = (py * w + px) * 4;
                    
                    switch(currentFilter) {
                        case 'glow':
                            data[idx] = Math.min(255, data[idx] * 1.3 + 40);
                            data[idx + 1] = Math.min(255, data[idx + 1] * 1.2 + 30);
                            data[idx + 2] = Math.min(255, data[idx + 2] * 1.1 + 20);
                            break;
                            
                        case 'rainbow':
                            const hue = (time * 3 + (idx / data.length) * 360) % 360;
                            const [r, g, b] = hslToRgb(hue, 100, 50);
                            data[idx] = data[idx] * 0.4 + r * 0.6;
                            data[idx + 1] = data[idx + 1] * 0.4 + g * 0.6;
                            data[idx + 2] = data[idx + 2] * 0.4 + b * 0.6;
                            break;
                            
                        case 'pixelate':
                            // Pixelate
                            const pixelSize = 8;
                            const pxGroup = Math.floor(px / pixelSize);
                            const pyGroup = Math.floor(py / pixelSize);
                            const seed = (pxGroup + pyGroup * Math.floor(w / pixelSize)) * 12345;
                            data[idx] = Math.abs(Math.sin(seed) * 255);
                            data[idx + 1] = Math.abs(Math.sin(seed + 1) * 255);
                            data[idx + 2] = Math.abs(Math.sin(seed + 2) * 255);
                            break;
                            
                        case 'blur':
                            data[idx + 3] = Math.max(0, data[idx + 3] * 0.6);
                            break;
                            
                        case 'invert':
                            data[idx] = 255 - data[idx];
                            data[idx + 1] = 255 - data[idx + 1];
                            data[idx + 2] = 255 - data[idx + 2];
                            break;
                    }
                }
            }
            
            ctx.putImageData(imageData, x, y);
        }
        
        function hslToRgb(h, s, l) {
            s /= 100;
            l /= 100;
            const a = s * Math.min(l, 1 - l);
            const f = n => {
                const k = (n + h / 30) % 12;
                return l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
            };
            return [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255)];
        }
        
        function stopCamera() {
            isRunning = false;
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(t => t.stop());
                document.getElementById('status').textContent = '⏹️ Stopped';
            }
        }
        
        function setFilter(f) {
            currentFilter = f;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }
        
        function captureImage() {
            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/png');
            link.download = 'face-filter-' + Date.now() + '.png';
            link.click();
        }
    </script>
</body>
</html>
