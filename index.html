<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Face Filter - Yoshi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: rgba(0, 0, 0, 0.8);
            border-radius: 20px;
            padding: 30px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            color: #fff;
            margin-bottom: 20px;
            text-align: center;
            font-size: 2.5em;
        }
        
        .video-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 0 auto 20px;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            aspect-ratio: 4 / 3;
        }
        
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .controls {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        
        button {
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        .filter-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .filter-btn {
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
        }
        
        .filter-btn:hover {
            background: rgba(102, 126, 234, 0.5);
            border-color: rgba(102, 126, 234, 1);
        }
        
        .filter-btn.active {
            background: rgba(102, 126, 234, 1);
            border-color: rgba(102, 126, 234, 1);
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.6);
        }
        
        .status {
            color: #0f0;
            text-align: center;
            font-size: 12px;
            padding: 10px;
            background: rgba(0, 255, 0, 0.1);
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐢 AR Face Filter</h1>
        
        <div class="video-container">
            <video id="video" autoplay playsinline muted></video>
            <canvas id="canvas"></canvas>
        </div>
        
        <div class="controls">
            <button onclick="startCamera()">📷 Start</button>
            <button onclick="stopCamera()">⏹️ Stop</button>
            <button onclick="captureImage()">📸 Snap</button>
        </div>
        
        <h3 style="color: #fff; margin-bottom: 10px;">Filters (Face Only)</h3>
        <div class="filter-grid">
            <button class="filter-btn active" onclick="setFilter('glow')">✨ Glow</button>
            <button class="filter-btn" onclick="setFilter('rainbow')">🌈 Rainbow</button>
            <button class="filter-btn" onclick="setFilter('pixelate')">🟫 Pixelate</button>
            <button class="filter-btn" onclick="setFilter('blur')">🌫️ Blur</button>
            <button class="filter-btn" onclick="setFilter('invert')">⚫ Invert</button>
            <button class="filter-btn" onclick="setFilter('none')">None</button>
        </div>
        
        <div class="status" id="status">Ready ✅</div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let isRunning = false;
        let currentFilter = 'glow';
        let time = 0;
        
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        width: { ideal: 640 },
                        height: { ideal: 480 },
                        facingMode: 'user'
                    }
                });
                
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    document.getElementById('status').textContent = `✅ Camera Started`;
                    isRunning = true;
                    drawWithEffects();
                };
            } catch (e) {
                document.getElementById('status').textContent = '❌ ' + e.message;
            }
        }
        
        function drawWithEffects() {
            if (!isRunning) return;
            
            // Draw original video
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            if (currentFilter !== 'none') {
                // Detect face region (simple skin color + center detection)
                const faceRegion = detectFaceRegion();
                
                if (faceRegion) {
                    applyFilterToRegion(faceRegion);
                }
            }
            
            time++;
            requestAnimationFrame(drawWithEffects);
        }
        
        function detectFaceRegion() {
            const w = canvas.width;
            const h = canvas.height;
            
            // Get image data
            const imageData = ctx.getImageData(0, 0, w, h);
            const data = imageData.data;
            
            // Find skin-colored pixels
            let skinPixels = [];
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                
                // Simple skin color detection
                if (isSkinColor(r, g, b)) {
                    const pixelIndex = i / 4;
                    const x = pixelIndex % w;
                    const y = Math.floor(pixelIndex / w);
                    skinPixels.push({x, y});
                }
            }
            
            // If skin pixels found, create bounding box
            if (skinPixels.length > 50) {
                const xs = skinPixels.map(p => p.x);
                const ys = skinPixels.map(p => p.y);
                
                const minX = Math.min(...xs);
                const maxX = Math.max(...xs);
                const minY = Math.min(...ys);
                const maxY = Math.max(...ys);
                
                const centerX = (minX + maxX) / 2;
                const centerY = (minY + maxY) / 2;
                const radius = Math.max(maxX - minX, maxY - minY) / 2 + 20;
                
                return {
                    centerX,
                    centerY,
                    radius,
                    left: Math.max(0, minX - 30),
                    top: Math.max(0, minY - 30),
                    right: Math.min(w, maxX + 30),
                    bottom: Math.min(h, maxY + 30)
                };
            }
            
            // Fallback: center region
            return {
                centerX: w / 2,
                centerY: h / 2,
                radius: Math.min(w, h) * 0.3,
                left: w * 0.2,
                top: h * 0.1,
                right: w * 0.8,
                bottom: h * 0.9
            };
        }
        
        function isSkinColor(r, g, b) {
            // Simple skin color detection
            return (r > 95 && g > 40 && b > 20) &&
                   (r > g && r > b) &&
                   (Math.abs(r - g) > 15) &&
                   (r - b > 15);
        }
        
        function applyFilterToRegion(region) {
            const imageData = ctx.getImageData(region.left, region.top, 
                                             region.right - region.left, 
                                             region.bottom - region.top);
            const data = imageData.data;
            
            switch(currentFilter) {
                case 'glow':
                    for (let i = 0; i < data.length; i += 4) {
                        data[i] = Math.min(255, data[i] * 1.2 + 30);
                        data[i + 1] = Math.min(255, data[i + 1] * 1.1 + 20);
                        data[i + 2] = Math.min(255, data[i + 2] * 1.0 + 10);
                    }
                    break;
                    
                case 'rainbow':
                    for (let i = 0; i < data.length; i += 4) {
                        const hue = (time * 2 + (i / data.length) * 360) % 360;
                        const [r, g, b] = hslToRgb(hue, 80, 60);
                        data[i] = data[i] * 0.5 + r * 0.5;
                        data[i + 1] = data[i + 1] * 0.5 + g * 0.5;
                        data[i + 2] = data[i + 2] * 0.5 + b * 0.5;
                    }
                    break;
                    
                case 'pixelate':
                    // Simple pixelate
                    for (let i = 0; i < data.length; i += 16) {
                        const avg_r = (data[i] + data[Math.min(i+4, data.length-1)] + data[Math.min(i+8, data.length-1)] + data[Math.min(i+12, data.length-1)]) / 4;
                        const avg_g = (data[i+1] + data[Math.min(i+5, data.length-1)] + data[Math.min(i+9, data.length-1)] + data[Math.min(i+13, data.length-1)]) / 4;
                        const avg_b = (data[i+2] + data[Math.min(i+6, data.length-1)] + data[Math.min(i+10, data.length-1)] + data[Math.min(i+14, data.length-1)]) / 4;
                        
                        data[i] = avg_r;
                        data[i+1] = avg_g;
                        data[i+2] = avg_b;
                    }
                    break;
                    
                case 'blur':
                    // Simple blur via opacity
                    for (let i = 0; i < data.length; i += 4) {
                        data[i] = data[i] * 0.8;
                        data[i + 1] = data[i + 1] * 0.8;
                        data[i + 2] = data[i + 2] * 0.8;
                        data[i + 3] = data[i + 3] * 0.6;
                    }
                    break;
                    
                case 'invert':
                    for (let i = 0; i < data.length; i += 4) {
                        data[i] = 255 - data[i];
                        data[i + 1] = 255 - data[i + 1];
                        data[i + 2] = 255 - data[i + 2];
                    }
                    break;
            }
            
            ctx.putImageData(imageData, region.left, region.top);
        }
        
        function hslToRgb(h, s, l) {
            s /= 100;
            l /= 100;
            const a = s * Math.min(l, 1 - l);
            const f = n => {
                const k = (n + h / 30) % 12;
                return l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
            };
            return [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255)];
        }
        
        function stopCamera() {
            isRunning = false;
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(t => t.stop());
                document.getElementById('status').textContent = '⏹️ Camera Stopped';
            }
        }
        
        function setFilter(f) {
            currentFilter = f;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('status').textContent = `Filter: ${f} ✨`;
        }
        
        function captureImage() {
            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/png');
            link.download = 'face-filter-' + Date.now() + '.png';
            link.click();
        }
    </script>
</body>
</html>
