<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Face Filter - Yoshi</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tracking.js/1.9.3/tracking.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tracking.js/1.9.3/data/face.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: rgba(0, 0, 0, 0.8);
            border-radius: 20px;
            padding: 30px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            color: #fff;
            margin-bottom: 20px;
            text-align: center;
            font-size: 2.5em;
        }
        
        .video-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 0 auto 20px;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            aspect-ratio: 4 / 3;
        }
        
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .controls {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        
        button {
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        .filter-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .filter-btn {
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
        }
        
        .filter-btn:hover {
            background: rgba(102, 126, 234, 0.5);
            border-color: rgba(102, 126, 234, 1);
        }
        
        .filter-btn.active {
            background: rgba(102, 126, 234, 1);
            border-color: rgba(102, 126, 234, 1);
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.6);
        }
        
        .status {
            color: #0f0;
            text-align: center;
            font-size: 12px;
            padding: 10px;
            background: rgba(0, 255, 0, 0.1);
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐢 AR Face Filter</h1>
        
        <div class="video-container">
            <video id="video" autoplay playsinline muted></video>
            <canvas id="canvas"></canvas>
        </div>
        
        <div class="controls">
            <button onclick="startCamera()">📷 Start</button>
            <button onclick="stopCamera()">⏹️ Stop</button>
            <button onclick="captureImage()">📸 Snap</button>
        </div>
        
        <h3 style="color: #fff; margin-bottom: 10px;">Filters (Face Only)</h3>
        <div class="filter-grid">
            <button class="filter-btn active" onclick="setFilter('glow')">✨ Glow</button>
            <button class="filter-btn" onclick="setFilter('rainbow')">🌈 Rainbow</button>
            <button class="filter-btn" onclick="setFilter('pixelate')">🟫 Pixelate</button>
            <button class="filter-btn" onclick="setFilter('blur')">🌫️ Blur</button>
            <button class="filter-btn" onclick="setFilter('invert')">⚫ Invert</button>
            <button class="filter-btn" onclick="setFilter('none')">None</button>
        </div>
        
        <div class="status" id="status">Ready ✅</div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let isRunning = false;
        let currentFilter = 'glow';
        let time = 0;
        let faces = [];
        let tracker = null;
        
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        width: { ideal: 640 },
                        height: { ideal: 480 },
                        facingMode: 'user'
                    }
                });
                
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    document.getElementById('status').textContent = `✅ Camera Started`;
                    isRunning = true;
                    
                    // Wait for tracking.js to be loaded
                    setTimeout(startTracking, 500);
                };
            } catch (e) {
                document.getElementById('status').textContent = '❌ ' + e.message;
            }
        }
        
        function startTracking() {
            if (typeof tracking === 'undefined') {
                document.getElementById('status').textContent = '⏳ Loading face detection...';
                setTimeout(startTracking, 500);
                return;
            }
            
            tracker = new tracking.ObjectTracker('face');
            tracker.setInitialScale(4);
            tracker.setStepSize(2);
            tracker.setEdgesDensity(0.1);
            
            tracking.track(video, tracker);
            
            tracker.on('track', function(event) {
                faces = event.data;
            });
            
            drawWithEffects();
        }
        
        function drawWithEffects() {
            if (!isRunning) return;
            
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            if (currentFilter !== 'none' && faces.length > 0) {
                faces.forEach(face => {
                    applyFilterToFace(face.x, face.y, face.width, face.height);
                });
                
                document.getElementById('status').textContent = `✅ ${faces.length} face(s) | Filter: ${currentFilter}`;
            } else if (faces.length === 0 && currentFilter !== 'none') {
                document.getElementById('status').textContent = '👀 Looking for face...';
            }
            
            time++;
            requestAnimationFrame(drawWithEffects);
        }
        
        function applyFilterToFace(x, y, w, h) {
            const margin = w * 0.15;
            const fx = Math.max(0, x - margin);
            const fy = Math.max(0, y - margin);
            const fw = Math.min(canvas.width - fx, w + margin * 2);
            const fh = Math.min(canvas.height - fy, h + margin * 2);
            
            const imageData = ctx.getImageData(fx, fy, fw, fh);
            const data = imageData.data;
            
            switch(currentFilter) {
                case 'glow':
                    for (let i = 0; i < data.length; i += 4) {
                        data[i] = Math.min(255, data[i] * 1.3 + 40);
                        data[i + 1] = Math.min(255, data[i + 1] * 1.2 + 30);
                        data[i + 2] = Math.min(255, data[i + 2] * 1.1 + 20);
                    }
                    break;
                    
                case 'rainbow':
                    for (let i = 0; i < data.length; i += 4) {
                        const hue = (time * 3 + (i / data.length) * 360) % 360;
                        const [r, g, b] = hslToRgb(hue, 100, 50);
                        data[i] = data[i] * 0.4 + r * 0.6;
                        data[i + 1] = data[i + 1] * 0.4 + g * 0.6;
                        data[i + 2] = data[i + 2] * 0.4 + b * 0.6;
                    }
                    break;
                    
                case 'pixelate':
                    const pixelSize = 8;
                    for (let py = 0; py < fh; py += pixelSize) {
                        for (let px = 0; px < fw; px += pixelSize) {
                            let r = 0, g = 0, b = 0, count = 0;
                            for (let dy = 0; dy < pixelSize; dy++) {
                                for (let dx = 0; dx < pixelSize; dx++) {
                                    const idx = ((py + dy) * fw + (px + dx)) * 4;
                                    if (idx < data.length) {
                                        r += data[idx];
                                        g += data[idx + 1];
                                        b += data[idx + 2];
                                        count++;
                                    }
                                }
                            }
                            const avgR = Math.floor(r / count);
                            const avgG = Math.floor(g / count);
                            const avgB = Math.floor(b / count);
                            
                            for (let dy = 0; dy < pixelSize; dy++) {
                                for (let dx = 0; dx < pixelSize; dx++) {
                                    const idx = ((py + dy) * fw + (px + dx)) * 4;
                                    if (idx < data.length) {
                                        data[idx] = avgR;
                                        data[idx + 1] = avgG;
                                        data[idx + 2] = avgB;
                                    }
                                }
                            }
                        }
                    }
                    break;
                    
                case 'blur':
                    for (let i = 0; i < data.length; i += 4) {
                        data[i + 3] = Math.max(0, data[i + 3] * 0.5);
                    }
                    break;
                    
                case 'invert':
                    for (let i = 0; i < data.length; i += 4) {
                        data[i] = 255 - data[i];
                        data[i + 1] = 255 - data[i + 1];
                        data[i + 2] = 255 - data[i + 2];
                    }
                    break;
            }
            
            ctx.putImageData(imageData, fx, fy);
        }
        
        function hslToRgb(h, s, l) {
            s /= 100;
            l /= 100;
            const a = s * Math.min(l, 1 - l);
            const f = n => {
                const k = (n + h / 30) % 12;
                return l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
            };
            return [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255)];
        }
        
        function stopCamera() {
            isRunning = false;
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(t => t.stop());
                document.getElementById('status').textContent = '⏹️ Camera Stopped';
            }
        }
        
        function setFilter(f) {
            currentFilter = f;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }
        
        function captureImage() {
            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/png');
            link.download = 'face-filter-' + Date.now() + '.png';
            link.click();
        }
    </script>
</body>
</html>
